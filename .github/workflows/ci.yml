name: Template checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject local-only materials in tracked files and history
        run: node scripts/check-private-sources.mjs
      - name: Check progress, completion gates, and source protection
        run: node --test --test-concurrency=1 scripts/context.test.mjs scripts/workflow-policy.test.mjs scripts/workspace-policy.test.mjs scripts/check-private-sources.test.mjs
      - name: Validate workflow state and evidence references
        run: node scripts/context.mjs check
  verify:
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated development settings
        run: cp .env.example .env
      - name: Validate template configuration and sample content
        run: node scripts/check-template.mjs
      - name: Build containers
        run: docker compose build
      - name: Create isolated PostgreSQL test database
        run: |
          docker compose up -d db --wait
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" world_history_test'
      - name: Check PostgreSQL API and security regressions
        run: docker compose run --rm -e APP_ENV=test -e DB_NAME=world_history_test frontend sh -c 'npm run db:migrate && npm run test:server'
      - name: Check frontend and production build
        run: docker compose run --rm frontend sh -c 'npm run security:check && npm test && npm run typecheck && npm run build'
      - name: Build and check non-root production image
        run: |
          dockerfile="$(python3 -c 'import tomllib; print(tomllib.load(open("frontend/fly.toml", "rb"))["build"]["dockerfile"])')"
          target="$(python3 -c 'import tomllib; print(tomllib.load(open("frontend/fly.toml", "rb"))["build"]["build-target"])')"
          docker build --target "$target" -f "$dockerfile" -t world-history-production-check .
          docker run --rm --network none world-history-production-check sh -ec '
            test "$(id -u)" -ne 0
            test ! -d app
            test ! -d tests
            test ! -d node_modules/@types/pg
            test ! -d node_modules/@iconify-json/lucide
            node --experimental-strip-types --input-type=module -e "await import(\"./server/operations/cli.ts\")"
            npm run security:check
          '
      - name: Stop isolated services
        if: always()
        run: docker compose down

app = "world-history-practice"
primary_region = "nrt"

[build]
build-target = "production"
dockerfile = "frontend/Dockerfile"

[deploy]
release_command = "npm run db:migrate"
release_command_timeout = "15m0s"

[env]
APP_ENV = "production"
BETTER_AUTH_URL = "https://world-history-practice.netlify.app"
CORS_ORIGINS = "https://world-history-practice.netlify.app"
FRONTEND_URL = "https://world-history-practice.netlify.app"
NITRO_HOST = "0.0.0.0"
NITRO_PORT = "3000"
NODE_ENV = "production"
NODE_OPTIONS = "--max-old-space-size=512"
NUXT_API_ONLY = "true"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3_000
min_machines_running = 0
processes = [ "app" ]

  [[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/v1/health"
  timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 1_024
